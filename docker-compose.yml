# ── AI Form Report · Docker Compose ──
# 本地一键启动：前端(Next.js) + 后端(Express)
# 数据库使用 Neon PostgreSQL（云端），无需本地容器
#
# 使用前确保 server/.env 已配置：
#   DATABASE_URL=postgresql://...  (Neon 连接串)
#   JWT_SECRET=your-secret-key

version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-form-server
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}
      - PORT=3001
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-form-app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    restart: unless-stopped
    depends_on:
      - server
